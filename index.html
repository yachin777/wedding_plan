<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>婚禮籌備</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --bg:#FAF7F6; --surface:#FFFFFF; --surface-2:#F4ECEA; --line:#E7DAD8;
  --ink:#2A1F23; --ink-2:#6E5C62; --ink-3:#9A8A8F;
  --red:#B32F37; --red-soft:#F7E1E1; --gold:#9C7A2E; --gold-soft:#F4EAD2;
  --ok:#2F7A55; --ok-soft:#DDEFE5; --warn:#A8620F; --warn-soft:#FAE9D2;
  --shadow:0 1px 2px rgba(60,20,30,.06),0 4px 16px rgba(60,20,30,.06);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#171214; --surface:#221A1D; --surface-2:#2C2226; --line:#3A2E33;
    --ink:#F2E9EA; --ink-2:#C2B2B6; --ink-3:#8E7E83;
    --red:#E46A70; --red-soft:#3E2226; --gold:#D6B460; --gold-soft:#3A3020;
    --ok:#6CC596; --ok-soft:#1E3429; --warn:#E6A454; --warn-soft:#3A2B18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171214; --surface:#221A1D; --surface-2:#2C2226; --line:#3A2E33;
  --ink:#F2E9EA; --ink-2:#C2B2B6; --ink-3:#8E7E83;
  --red:#E46A70; --red-soft:#3E2226; --gold:#D6B460; --gold-soft:#3A3020;
  --ok:#6CC596; --ok-soft:#1E3429; --warn:#E6A454; --warn-soft:#3A2B18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:center;gap:12px}
.seal{flex:none;width:40px;height:40px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:22px;line-height:1}
.brand h1{margin:0;font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.04em}
.brand p{margin:0;color:var(--ink-2);font-size:13px}
.overall{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-2)}
.overall b{display:block;font-size:18px;color:var(--ink);font-weight:700}

/* stage tabs */
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stage{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stage[aria-selected="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.stage .step{font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.stage .name{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.1}
.stage[aria-selected="true"] .name{color:var(--red)}
.stage .pct{font-size:22px;font-weight:700;line-height:1}
.stage .pct small{font-size:12px;font-weight:500;color:var(--ink-2);margin-left:1px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .4s ease}
.stage .meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--ink-2)}
.od{color:var(--red);font-weight:700}
.od.zero{color:var(--ink-3);font-weight:400}

/* stage detail */
.detail{margin-top:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--ink-2)}
.kpi b{font-size:18px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.alert b{color:var(--red)}
@media (max-width:480px){.detail{grid-template-columns:repeat(2,minmax(0,1fr))}}

.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.toolbar select{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px;max-width:45%}

.banner{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.banner button{margin-left:auto;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:500}

/* list */
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.group-h{font-size:12px;color:var(--ink-3);letter-spacing:.08em;margin-top:8px}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
.task.overdue{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.task.done{opacity:.62}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task.done .check svg{opacity:1}
.t-body{min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:6px}
.t-row{display:flex;align-items:flex-start;gap:8px}
.t-title{font-weight:700;font-size:15.5px;line-height:1.35;flex:1;min-width:0;overflow-wrap:anywhere}
.due{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.due.late{background:var(--red-soft);color:var(--red)}
.due.soon{background:var(--warn-soft);color:var(--warn)}
.due.ok{background:var(--ok-soft);color:var(--ok)}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12px}
.tag{padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2)}
.tag.cat{background:var(--gold-soft);color:var(--gold)}
.tag.u0{background:var(--red);color:#fff}
.tag.u1{background:var(--red-soft);color:var(--red)}
.tag.p0{border:1px solid var(--red);color:var(--red);background:transparent}
.facts{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--ink-2)}
.facts span{white-space:nowrap}
.note{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--ink-3);padding:40px 12px;border:1px dashed var(--line);border-radius:12px;font-size:14px}

.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;border:0;background:var(--red);color:#fff;border-radius:999px;padding:13px 20px 13px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px color-mix(in srgb,var(--red) 40%,transparent)}
.fab svg{width:20px;height:20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,8,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-family:var(--serif);font-size:18px}
.x{margin-left:auto;border:0;background:var(--surface-2);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:18px;line-height:1;color:var(--ink-2)}
.sheet-b{overflow-y:auto;padding:14px 16px 8px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.f label em{color:var(--red);font-style:normal}
.f input,.f select,.f textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;font-size:16px;min-height:42px}
.f textarea{min-height:72px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 4px;font-family:var(--serif);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.err{grid-column:1/-1;color:var(--red);font-size:13px;margin:0}
.sheet-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;margin-left:auto;min-width:96px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.danger.arm{background:var(--red);color:#fff}
.done-row{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px}
.done-row input{width:20px;height:20px;accent-color:var(--ok)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true">囍</div>
      <div>
        <h1>婚禮籌備</h1>
        <p>提親 → 訂婚 → 婚禮</p>
      </div>
      <div class="overall num" id="overall"><b>0%</b>整體進度</div>
    </div>
    <div class="stages" role="tablist" id="stages"></div>
  </header>

  <section class="detail num" id="detail"></section>
  <div id="bannerSlot"></div>
  <div class="toolbar" id="toolbar">
    <button class="chip" data-f="all">全部</button>
    <button class="chip" data-f="open">待辦</button>
    <button class="chip" data-f="overdue">逾期</button>
    <button class="chip" data-f="done">已完成</button>
    <select id="catFilter" aria-label="依類別篩選"></select>
  </div>
  <main class="list" id="list"><div class="empty">載入中…</div></main>
</div>

<button class="fab" id="addBtn" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新增項目
</button>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" novalidate>
    <div class="sheet-h"><h2 id="formTitle">新增項目</h2><button type="button" class="x" id="closeBtn" aria-label="關閉">×</button></div>
    <div class="sheet-b">
      <div class="f full"><label>階段 <em>*</em></label><div class="seg" id="fStage"></div></div>
      <div class="f full"><label for="fItem">項目 <em>*</em></label><input id="fItem" maxlength="80" placeholder="例如：預訂訂婚喜餅" autocomplete="off"></div>
      <div class="f"><label for="fCat">類別</label><select id="fCat"></select></div>
      <div class="f"><label for="fOwner">負責處理人</label><select id="fOwner"></select></div>
      <div class="f" id="fCatNewWrap" hidden><label for="fCatNew">新類別名稱</label><input id="fCatNew" maxlength="12"></div>
      <div class="f" id="fOwnerNewWrap" hidden><label for="fOwnerNew">新負責人名稱</label><input id="fOwnerNew" maxlength="12"></div>
      <div class="f"><label for="fDate">活動日期</label><input type="date" id="fDate"></div>
      <div class="f"><label for="fDue">最後期限</label><input type="date" id="fDue"></div>
      <div class="f"><label for="fStart">開始時間</label><input type="time" id="fStart"></div>
      <div class="f"><label for="fEnd">結束時間</label><input type="time" id="fEnd"></div>
      <div class="f"><label for="fUrg">急迫性</label><select id="fUrg"></select></div>
      <div class="f"><label for="fPri">優先等級</label><select id="fPri"></select></div>
      <div class="f full"><label for="fCost">預估成本（新台幣）</label><input type="number" id="fCost" inputmode="numeric" min="0" step="100" placeholder="0"></div>
      <div class="f full"><label for="fNote">備註</label><textarea id="fNote" maxlength="500" placeholder="廠商聯絡方式、注意事項…"></textarea></div>
      <label class="done-row" id="doneRow"><input type="checkbox" id="fDone"> 已完成</label>
      <p class="err" id="fErr" hidden></p>
    </div>
    <div class="sheet-f">
      <button type="button" class="btn danger" id="delBtn" hidden>刪除</button>
      <button type="button" class="btn" id="cancelBtn">取消</button>
      <button type="submit" class="btn primary" id="saveBtn">儲存</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const STAGES=[{id:'proposal',name:'提親',step:'STEP 1'},{id:'engagement',name:'訂婚',step:'STEP 2'},{id:'wedding',name:'婚禮',step:'STEP 3'}];
const URGENCY=['非常緊急','緊急','一般','不急'];
const PRIORITY=['高','中','低'];
const DEFAULT_OPTS={
  categories:['禮俗儀式','場地餐飲','服裝造型','攝影錄影','喜餅禮品','金飾婚戒','賓客喜帖','交通住宿','佈置婚顧','其他'],
  people:['新郎','新娘','新人一起','男方家長','女方家長','媒人','婚顧']
};
const NEW='__new__';
const state={tasks:[],opts:structuredClone(DEFAULT_OPTS),stage:'proposal',filter:'all',cat:'',ready:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dayDiff=(a,b)=>Math.round((Date.parse(a+'T00:00:00')-Date.parse(b+'T00:00:00'))/864e5);
const money=n=>'NT$'+Math.round(n||0).toLocaleString('zh-TW');
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');const w='日一二三四五六'[new Date(s+'T00:00:00').getDay()];return `${+m}/${+d}（${w}）`};
const isOverdue=t=>!t.done&&t.due&&t.due<todayStr();

try{const s=localStorage.getItem('wp-stage');if(STAGES.some(x=>x.id===s))state.stage=s}catch{}
if(STAGES.some(x=>x.id===location.hash.slice(1)))state.stage=location.hash.slice(1);

/* ---------- storage: shared db, falling back to this browser ---------- */
const store={
  db:null,
  async init(){
    let db=null;
    try{ if(window.claude?.use) db=await window.claude.use('db'); }catch{}
    if(db){
      this.db=db;
      db.collection('tasks').onSnapshot(snap=>{
        state.tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
        state.ready=true;render();
      },()=>toast('與資料庫的連線中斷，請重新整理頁面'));
      db.doc('meta/options').onSnapshot(s=>{
        const d=s.exists?s.data():null;
        if(d){state.opts={categories:d.categories?.length?[...d.categories]:[...DEFAULT_OPTS.categories],people:d.people?.length?[...d.people]:[...DEFAULT_OPTS.people]};render()}
      },()=>{});
    }else{
      try{const raw=JSON.parse(localStorage.getItem('wp-local')||'null');if(raw){state.tasks=raw.tasks||[];if(raw.opts)state.opts=raw.opts}}catch{}
      state.ready=true;render();
      toast('目前資料只存在這個瀏覽器');
    }
  },
  newId(){return this.db?this.db.collection('tasks').doc().id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)},
  persistLocal(){try{localStorage.setItem('wp-local',JSON.stringify({tasks:state.tasks,opts:state.opts}))}catch{}},
  async save(task){
    const {id,...body}=task;
    if(this.db){await this.db.collection('tasks').doc(id).set(body);return}
    const i=state.tasks.findIndex(t=>t.id===id);
    if(i>=0)state.tasks[i]=task;else state.tasks.push(task);
    this.persistLocal();render();
  },
  async remove(id){
    if(this.db){await this.db.collection('tasks').doc(id).delete();return}
    state.tasks=state.tasks.filter(t=>t.id!==id);this.persistLocal();render();
  },
  async saveOpts(){
    if(this.db){await this.db.doc('meta/options').set({categories:state.opts.categories,people:state.opts.people});return}
    this.persistLocal();
  }
};

/* ---------- stats ---------- */
function stats(list){
  const total=list.length,done=list.filter(t=>t.done).length,overdue=list.filter(isOverdue).length;
  const cost=list.reduce((s,t)=>s+(+t.cost||0),0);
  const next=list.filter(t=>!t.done&&t.due&&t.due>=todayStr()).sort((a,b)=>a.due.localeCompare(b.due))[0];
  return{total,done,overdue,cost,pct:total?Math.round(done/total*100):0,next};
}

/* ---------- render ---------- */
function render(){
  const all=stats(state.tasks);
  $('overall').innerHTML=`<b>${all.pct}%</b>整體 ${all.done}/${all.total}`;

  $('stages').innerHTML=STAGES.map(s=>{
    const st=stats(state.tasks.filter(t=>t.stage===s.id));
    return `<button class="stage num" role="tab" data-stage="${s.id}" aria-selected="${s.id===state.stage}">
      <span class="step">${s.step}</span><span class="name">${s.name}</span>
      <span class="pct">${st.pct}<small>%</small></span>
      <span class="bar"><i style="width:${st.pct}%"></i></span>
      <span class="meta"><span>完成 ${st.done}/${st.total}</span><span class="od ${st.overdue?'':'zero'}">逾期 ${st.overdue}</span></span>
    </button>`}).join('');

  const cur=state.tasks.filter(t=>t.stage===state.stage);
  const st=stats(cur);
  $('detail').innerHTML=`
    <div class="kpi"><span>完成 / 總數</span><b>${st.done} / ${st.total}</b></div>
    <div class="kpi ${st.overdue?'alert':''}"><span>逾期</span><b>${st.overdue} 項</b></div>
    <div class="kpi"><span>預估成本</span><b>${money(st.cost)}</b></div>
    <div class="kpi"><span>下一個期限</span><b>${st.next?fmtDate(st.next.due):'—'}</b></div>`;

  const samples=state.tasks.filter(t=>t.sample).length;
  $('bannerSlot').innerHTML=samples?`<div class="banner"><span>目前有 ${samples} 筆範例資料，可以直接修改，或一次清除。</span><button type="button" id="clearSamples">清除範例</button></div>`:'';

  document.querySelectorAll('#toolbar .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===state.filter));
  const cats=[...new Set(cur.map(t=>t.category).filter(Boolean))];
  if(state.cat&&!cats.includes(state.cat))state.cat='';
  $('catFilter').innerHTML=`<option value="">所有類別</option>`+cats.map(c=>`<option ${c===state.cat?'selected':''}>${esc(c)}</option>`).join('');

  if(!state.ready){$('list').innerHTML='<div class="empty">載入中…</div>';return}
  let list=cur.filter(t=>!state.cat||t.category===state.cat);
  if(state.filter==='open')list=list.filter(t=>!t.done);
  if(state.filter==='overdue')list=list.filter(isOverdue);
  if(state.filter==='done')list=list.filter(t=>t.done);
  const key=t=>t.due||t.date||'9999';
  const pr=t=>PRIORITY.indexOf(t.priority);
  list.sort((a,b)=>(a.done-b.done)||key(a).localeCompare(key(b))||(pr(a)-pr(b)));

  if(!list.length){
    const name=STAGES.find(s=>s.id===state.stage).name;
    $('list').innerHTML=`<div class="empty">${cur.length?'這個篩選條件下沒有項目':`「${name}」還沒有任何項目<br>點右下角「新增項目」開始`}</div>`;
    return;
  }
  let html='',shownDone=false;
  for(const t of list){
    if(t.done&&!shownDone&&state.filter==='all'&&list.some(x=>!x.done)){html+='<div class="group-h">已完成</div>';shownDone=true}
    html+=card(t);
  }
  $('list').innerHTML=html;
}

function dueBadge(t){
  if(t.done)return `<span class="due ok">已完成</span>`;
  if(!t.due)return '';
  const d=dayDiff(t.due,todayStr());
  if(d<0)return `<span class="due late num">逾期 ${-d} 天</span>`;
  if(d===0)return `<span class="due late">今天到期</span>`;
  return `<span class="due ${d<=7?'soon':''} num">剩 ${d} 天</span>`;
}
function card(t){
  const u=URGENCY.indexOf(t.urgency);
  const time=t.start?`${t.start}${t.end?'–'+t.end:''}`:'';
  const facts=[
    t.date?`<span>活動 ${fmtDate(t.date)}${time?' '+time:''}</span>`:(time?`<span>${time}</span>`:''),
    t.due?`<span>期限 ${fmtDate(t.due)}</span>`:'',
    t.owner?`<span>負責：${esc(t.owner)}</span>`:'',
    t.cost?`<span>${money(t.cost)}</span>`:''
  ].join('');
  return `<article class="task ${t.done?'done':''} ${isOverdue(t)?'overdue':''}">
    <button class="check" type="button" data-toggle="${t.id}" aria-label="${t.done?'標為未完成':'標為完成'}">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </button>
    <button class="t-body" type="button" data-edit="${t.id}">
      <span class="t-row"><span class="t-title">${esc(t.item)}</span>${dueBadge(t)}</span>
      <span class="tags">
        ${t.category?`<span class="tag cat">${esc(t.category)}</span>`:''}
        ${t.urgency?`<span class="tag ${u===0?'u0':u===1?'u1':''}">${esc(t.urgency)}</span>`:''}
        ${t.priority?`<span class="tag ${t.priority==='高'?'p0':''}">優先 ${esc(t.priority)}</span>`:''}
      </span>
      ${facts?`<span class="facts num">${facts}</span>`:''}
      ${t.note?`<span class="note">${esc(t.note)}</span>`:''}
    </button>
  </article>`;
}

/* ---------- form ---------- */
let editing=null,formStage='proposal',delArmed=false;
function fillSelect(el,items,val,withNew,newLabel){
  const list=[...items];if(val&&!list.includes(val))list.push(val);
  el.innerHTML=`<option value="">— 未指定 —</option>`+list.map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('')+(withNew?`<option value="${NEW}">＋ ${newLabel}</option>`:'');
}
function setStageSeg(){ $('fStage').innerHTML=STAGES.map(s=>`<button type="button" data-seg="${s.id}" aria-pressed="${s.id===formStage}">${s.name}</button>`).join('') }
function openForm(task){
  editing=task||null;delArmed=false;
  const t=task||{stage:state.stage,urgency:'一般',priority:'中'};
  formStage=t.stage;setStageSeg();
  $('formTitle').textContent=task?'編輯項目':'新增項目';
  $('fItem').value=t.item||'';
  fillSelect($('fCat'),state.opts.categories,t.category||(state.cat||''),true,'新增類別');
  fillSelect($('fOwner'),state.opts.people,t.owner||'',true,'新增負責人');
  fillSelect($('fUrg'),URGENCY,t.urgency||'',false);
  fillSelect($('fPri'),PRIORITY,t.priority||'',false);
  $('fDate').value=t.date||'';$('fDue').value=t.due||'';
  $('fStart').value=t.start||'';$('fEnd').value=t.end||'';
  $('fCost').value=t.cost||'';$('fNote').value=t.note||'';
  $('fDone').checked=!!t.done;$('doneRow').hidden=!task;
  $('fCatNewWrap').hidden=$('fOwnerNewWrap').hidden=true;$('fCatNew').value=$('fOwnerNew').value='';
  $('delBtn').hidden=!task;$('delBtn').textContent='刪除';$('delBtn').classList.remove('arm');
  $('fErr').hidden=true;
  $('scrim').hidden=false;document.body.style.overflow='hidden';
  if(!task)setTimeout(()=>$('fItem').focus(),50);
}
function closeForm(){$('scrim').hidden=true;document.body.style.overflow='';editing=null}
function showErr(m){$('fErr').textContent=m;$('fErr').hidden=false}

$('fCat').onchange=e=>{$('fCatNewWrap').hidden=e.target.value!==NEW;if(e.target.value===NEW)$('fCatNew').focus()};
$('fOwner').onchange=e=>{$('fOwnerNewWrap').hidden=e.target.value!==NEW;if(e.target.value===NEW)$('fOwnerNew').focus()};
$('fStage').onclick=e=>{const b=e.target.closest('[data-seg]');if(b){formStage=b.dataset.seg;setStageSeg()}};

$('form').onsubmit=async e=>{
  e.preventDefault();
  const item=$('fItem').value.trim();
  if(!item){showErr('請輸入項目內容');$('fItem').focus();return}
  let cat=$('fCat').value,owner=$('fOwner').value,optsChanged=false;
  if(cat===NEW){cat=$('fCatNew').value.trim();if(!cat){showErr('請輸入新類別名稱');return}if(!state.opts.categories.includes(cat)){state.opts.categories.push(cat);optsChanged=true}}
  if(owner===NEW){owner=$('fOwnerNew').value.trim();if(!owner){showErr('請輸入新負責人名稱');return}if(!state.opts.people.includes(owner)){state.opts.people.push(owner);optsChanged=true}}
  const start=$('fStart').value,end=$('fEnd').value;
  if(start&&end&&end<start){showErr('結束時間要晚於開始時間');return}
  const cost=$('fCost').value===''?0:Number($('fCost').value);
  if(!(cost>=0)){showErr('預估成本需為 0 以上的數字');return}
  const task={
    id:editing?.id||store.newId(),stage:formStage,category:cat,item,
    date:$('fDate').value,due:$('fDue').value,start,end,
    urgency:$('fUrg').value,owner,priority:$('fPri').value,cost,note:$('fNote').value.trim(),
    done:editing?$('fDone').checked:false,
    createdAt:editing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()
  };
  const isEdit=!!editing;
  $('saveBtn').disabled=true;
  try{
    if(optsChanged)await store.saveOpts();
    await store.save(task);
    if(task.stage!==state.stage){state.stage=task.stage;remember()}
    closeForm();toast(isEdit?'已更新':'已新增');render();
  }catch(err){showErr(saveErrMsg(err))}
  finally{$('saveBtn').disabled=false}
};
function saveErrMsg(err){
  const c=err?.code;
  if(c==='permission_denied'||c==='not_granted')return '你目前只有檢視權限，無法儲存。請擁有者給你編輯權限。';
  if(c==='quota_exceeded')return '資料數量已達上限，請先刪除部分項目。';
  return '儲存失敗，請檢查網路後再試一次。';
}
$('delBtn').onclick=async()=>{
  if(!delArmed){delArmed=true;$('delBtn').textContent='確定刪除？';$('delBtn').classList.add('arm');return}
  try{await store.remove(editing.id);closeForm();toast('已刪除')}catch(err){showErr(saveErrMsg(err))}
};
$('closeBtn').onclick=$('cancelBtn').onclick=closeForm;
$('scrim').onclick=e=>{if(e.target===$('scrim'))closeForm()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('scrim').hidden)closeForm()});

/* ---------- page events ---------- */
function remember(){try{localStorage.setItem('wp-stage',state.stage)}catch{}}
$('stages').onclick=e=>{const b=e.target.closest('[data-stage]');if(b){state.stage=b.dataset.stage;state.cat='';remember();render()}};
$('toolbar').onclick=e=>{const b=e.target.closest('[data-f]');if(b){state.filter=b.dataset.f;render()}};
$('catFilter').onchange=e=>{state.cat=e.target.value;render()};
$('addBtn').onclick=()=>openForm(null);
let clearArmed=false;
document.addEventListener('click',async e=>{
  const tg=e.target.closest('[data-toggle]');
  if(tg){const t=state.tasks.find(x=>x.id===tg.dataset.toggle);if(!t)return;
    try{await store.save({...t,done:!t.done,updatedAt:new Date().toISOString()});toast(t.done?'已標為未完成':'完成一項 ✓')}catch(err){toast(saveErrMsg(err))}
    return}
  const ed=e.target.closest('[data-edit]');
  if(ed){const t=state.tasks.find(x=>x.id===ed.dataset.edit);if(t)openForm(t);return}
  if(e.target.id==='clearSamples'){
    if(!clearArmed){clearArmed=true;e.target.textContent='確定清除？';return}
    clearArmed=false;
    try{for(const t of state.tasks.filter(x=>x.sample))await store.remove(t.id);toast('已清除範例')}catch(err){toast(saveErrMsg(err))}
  }
});
let toastT;
function toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}

render();
store.init();
</script>
</body>
</html>
