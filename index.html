<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B32F37">
<!--
  婚禮籌備網頁
  這個檔案只放頁面骨架；樣式在 css/，功能在 js/。檔案說明請看 README.md。
-->
<title>婚禮籌備</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<!-- 樣式：基本 → 版面 → 各分頁 → 表單與互動元件 -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/form.css">
</head>
<body>
<!-- ===== 側邊欄：電腦版固定在左邊；手機版按左上角 ☰ 從左邊滑出（分頁按鈕由 js/render.js 產生） ===== -->
<aside class="sidebar" id="sidebar" aria-label="主要功能">
  <div class="side-brand">
    <div class="seal" aria-hidden="true">哈</div>
    <div><b>婚禮籌備</b><p class="subline">提親 → 訂婚 → 婚禮</p></div>
  </div>
  <nav class="side-nav" id="tabbar"></nav>
  <button class="tab side-settings" type="button" data-action="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>婚禮設定</span></button>
</aside>
<div class="nav-scrim" id="navScrim" hidden></div>

<!-- ===== 頁首（只在手機顯示）＋主要內容（各分頁的內容由 js/views/ 產生，放進 #view） ===== -->
<div class="wrap">
  <header class="top">
    <div class="brand">
      <button class="icon-btn menu-btn" type="button" data-action="menu" aria-label="開啟選單" aria-controls="sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="seal" aria-hidden="true">哈</div>
      <div>
        <h1>婚禮籌備</h1>
        <p class="subline">提親 → 訂婚 → 婚禮</p>
      </div>
      <button class="icon-btn" type="button" data-action="settings" aria-label="婚禮設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <main id="view"><div class="empty" style="margin-top:16px">載入中…</div></main>
</div>

<!-- ===== 右下角「新增」按鈕 ===== -->
<button class="fab" id="fab" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fabLabel">新增項目</span>
</button>


<!-- ===== 新增／編輯表單（欄位由 js/form.js 產生） ===== -->
<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="form" novalidate>
    <div class="sheet-h"><h2 id="formTitle">新增</h2><button type="button" class="x" id="closeBtn" aria-label="關閉">×</button></div>
    <div class="sheet-b" id="formBody"></div>
    <div class="sheet-f">
      <button type="button" class="btn danger" id="delBtn" hidden>刪除</button>
      <button type="button" class="btn" id="cancelBtn">取消</button>
      <button type="submit" class="btn primary" id="saveBtn">儲存</button>
    </div>
  </form>
</div>
<!-- ===== 提示訊息 ===== -->
<div class="toast" id="toast" hidden></div>
<!-- ===== 照片放大檢視 ===== -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-label="照片">
  <img id="lbImg" alt="">
  <button type="button" class="lb-x" id="lbClose" aria-label="關閉">×</button>
  <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="上一張">‹</button>
  <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="下一張">›</button>
  <div class="lb-count num" id="lbCount"></div>
</div>

<!-- ===== Firebase：雲端同步與 Google 登入（設定值在 firebase-config.js） ===== -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<!-- ===== 網頁功能（順序很重要：後面的檔案會用到前面檔案的東西，main.js 必須最後） ===== -->
<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/views/overview.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/vendors.js"></script>
<script src="js/views/articles.js"></script>
<script src="js/views/budget.js"></script>
<script src="js/render.js"></script>
<script src="js/form.js"></script>
<script src="js/photos.js"></script>
<script src="js/events.js"></script>
<script src="js/main.js"></script>
</body>
</html>
